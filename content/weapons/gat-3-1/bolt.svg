<?xml version="1.0" encoding="UTF-8"?>
<!-- Gat 3.1 bolt: a Gato laser (own drawing, genre-like per docs/reference/genre-battle-screen: a streak about 40 by
     10 px with a bright head and a thinning, flickering tail). Drawn nose up; the top centre is the point on the
     flight path. Gato style: a hot white core in a gold sheath with a slight amber tail, and a faint spark ring
     behind the head. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 48" width="16" height="48">
  <defs>
    <linearGradient id="tail" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE066" stop-opacity="0.95"/>
      <stop offset="0.55" stop-color="#FFB13B" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FF8500" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFF4C2" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#FFE066" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- outer sheath, flickering as the genre's four frames do (0.5 s cycle) -->
  <path d="M8 2 C12 2 13 10 12 26 L8 46 L4 26 C3 10 4 2 8 2 Z" fill="url(#tail)">
    <animate attributeName="opacity" values="0.7;1;0.8;1;0.7" dur="0.5s" repeatCount="indefinite"/>
  </path>
  <!-- tail flicker: a second, narrower tongue that lengthens and shortens -->
  <path d="M8 8 L9.5 22 L8 40 L6.5 22 Z" fill="#FFF4C2" opacity="0.6">
    <animate attributeName="d" values="M8 8 L9.5 22 L8 40 L6.5 22 Z;M8 8 L9.5 20 L8 32 L6.5 20 Z;M8 8 L9.5 24 L8 44 L6.5 24 Z;M8 8 L9.5 22 L8 40 L6.5 22 Z" dur="0.5s" repeatCount="indefinite"/>
  </path>
  <!-- head glow and the white-hot core -->
  <circle cx="8" cy="7" r="7" fill="url(#glow)"/>
  <ellipse cx="8" cy="7" rx="3.4" ry="4.2" fill="#FFFFFF"/>
  <!-- the Gato spark ring behind the head -->
  <circle cx="8" cy="13" r="3.6" fill="none" stroke="#FFF4C2" stroke-width="0.8" opacity="0.7"/>
</svg>
