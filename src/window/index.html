<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Infall: Escape The Collapse</title>
  <style>
    /* GDD 14B: muted blue boxes, white text. Placeholder look until the GUI discussion (14A). */
    :root { --box: #1d2a3a; --edge: #4a6a8a; --text: #ffffff; --faint: #9fb3c8; --space: #0b1018; }
    html, body { height: 100%; margin: 0; }
    body { background: var(--space); color: var(--text); font: 15px/1.4 system-ui, sans-serif; display: grid; grid-template-rows: auto 1fr auto; overflow: hidden; }
    #battle-area { position: relative; min-height: 0; grid-row: 2; }   /* stays in the stretching row when the header hides */
    #battle-area > svg { position: absolute; inset: 0; }
    header, footer, #dock-band { background: var(--box); border-bottom: 1px solid var(--edge); padding: 8px 16px; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
    footer { border-bottom: none; border-top: 1px solid var(--edge); display: grid; gap: 6px; }
    h1 { margin: 0; font-size: 18px; }
    select, input { background: var(--space); color: var(--text); border: 1px solid var(--edge); padding: 6px; font: inherit; }
    #ship-caption { color: var(--faint); }
    #viewport { width: 100%; height: 100%; display: block; cursor: default; touch-action: none; }
    /* the floating GUI: a screen-sized layer over the battle; only its elements take the pointer */
    #hud { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; display: none; }
    #hud .clickable { pointer-events: auto; }
    body.battle #hud { display: block; }
    #viewport.panning { cursor: grabbing; }
    pre { margin: 0; white-space: pre-wrap; color: var(--faint); max-height: 6em; overflow: auto; }

    /* the card GUI (Settings: Battle GUI card) floats over the battle's bottom-left corner */
    #dock-band { display: none; position: absolute; left: 8px; bottom: 8px; padding: 0; background: none; border: none; z-index: 1; }
    #dock { width: 356px; height: 192px; display: block; }
    body.battle #viewer-band { display: none; }
    body.battle.gui-card #dock-band { display: block; }
    body.battle footer { display: none; }
    body.battle.console-open footer { display: grid; position: fixed; left: 0; right: 0; top: 0; z-index: 2; box-shadow: 0 6px 20px #000; }

    /* cursors say what the next click does (the genre's crosshair for aiming) */
    .clickable, rect.door, [data-crew-id] { cursor: pointer; }
    body.armed #viewport rect.tile.enemy { cursor: crosshair; }
    body.crew-selected #viewport rect.tile.own { cursor: cell; }
    rect.tile.hover-room { fill: #ffd27a; }
    body.crew-selected #viewport rect.tile.own:hover { fill: #bfe3ff; }
  </style>
</head>
<body>
  <header id="viewer-band">
    <h1>Infall: Escape The Collapse</h1>
    <label>Ship <select id="ship-picker"></select></label>
    <label>Side <select id="side-picker"><option value="player">Player</option><option value="enemy">Enemy</option></select></label>
    <span id="ship-caption"></span>
  </header>
  <div id="battle-area">
    <svg id="viewport" xmlns="http://www.w3.org/2000/svg"></svg>
    <svg id="hud" xmlns="http://www.w3.org/2000/svg"></svg>
    <div id="dock-band"><svg id="dock" xmlns="http://www.w3.org/2000/svg"></svg></div>
  </div>
  <footer>
    <input id="debug-line" placeholder="Debug console: type a command and press Enter (help lists them)">
    <pre id="debug-output"></pre>
  </footer>
  <script type="module" src="window.js"></script>
</body>
</html>
