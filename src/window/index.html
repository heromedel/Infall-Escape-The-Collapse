<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Infall: Escape The Collapse</title>
  <style>
    /* GDD 14B: muted blue boxes, white text. Placeholder look until the GUI discussion (14A). */
    :root { --box: #1d2a3a; --edge: #4a6a8a; --text: #ffffff; --faint: #9fb3c8; --space: #0b1018; }
    html, body { height: 100%; margin: 0; }
    body { background: var(--space); color: var(--text); font: 15px/1.4 system-ui, sans-serif; display: grid; grid-template-rows: auto 1fr auto; }
    header, footer { background: var(--box); border-bottom: 1px solid var(--edge); padding: 8px 16px; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
    footer { border-bottom: none; border-top: 1px solid var(--edge); display: grid; gap: 6px; }
    h1 { margin: 0; font-size: 18px; }
    select, input { background: var(--space); color: var(--text); border: 1px solid var(--edge); padding: 6px; font: inherit; }
    #ship-caption { color: var(--faint); }
    #viewport { width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
    pre { margin: 0; white-space: pre-wrap; color: var(--faint); max-height: 6em; overflow: auto; }
  </style>
</head>
<body>
  <header>
    <h1>Infall: Escape The Collapse</h1>
    <label>Ship <select id="ship-picker"></select></label>
    <label>Side <select id="side-picker"><option value="player">Player</option><option value="enemy">Enemy</option></select></label>
    <span id="ship-caption"></span>
  </header>
  <svg id="viewport" xmlns="http://www.w3.org/2000/svg"></svg>
  <footer>
    <input id="debug-line" placeholder="Debug console: type a command and press Enter (help lists them)">
    <pre id="debug-output"></pre>
  </footer>
  <script type="module" src="window.js"></script>
</body>
</html>
